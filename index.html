<!doctype html>
<html lang="en">
<head>

<title>MileSplit</title>
<style>
:root{--brand:#0b4645;--brand2:#0f8f8b;--ink:#173739;--muted:#6d7f80;--bg:#f4f8f7;--card:#fff;--line:#d9e6e4;--company:#276b86;--personal:#2d9c72;--total:#bd8210;--danger:#c83d42;--shadow:0 5px 18px rgba(19,55,57,.08);--radius:18px}
*{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}body{margin:0;background:var(--bg);min-height:100vh}button,input,select{font:inherit;font-size:16px}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.app{max-width:820px;margin:0 auto;min-height:100vh}.topbar{height:92px;background:var(--brand);color:#fff;display:flex;align-items:center;padding:0 22px;gap:14px;box-shadow:0 6px 18px rgba(11,70,69,.16);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:46px;height:46px;flex:0 0 46px}.brand-name{font-size:31px;font-weight:800;letter-spacing:-1.2px;white-space:nowrap}.header-spacer{flex:1}.program-btn,.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.42);border-radius:16px;height:52px}.program-btn{padding:0 15px;max-width:205px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icon-btn{width:52px;font-size:25px;border-color:transparent}.menu{position:absolute;right:18px;top:78px;background:#fff;color:var(--ink);width:min(330px,calc(100vw - 36px));border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(19,55,57,.18);padding:8px;display:none}.menu.open{display:block}.menu h4{margin:8px 10px 5px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 10px;border-radius:11px;color:var(--ink)}.menu button:hover{background:#eef6f5}.menu .active{font-weight:750;background:#edf7f5}.content{padding:28px 24px 56px}.section-label{font-size:14px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px}.balances{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.balance-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px 18px 15px;box-shadow:var(--shadow);min-width:0}.balance-card.company{border-color:#d7e6eb}.balance-card.personal{border-color:#d8ebe3}.balance-card.total{border-color:#f1e4c9}.balance-label{font-weight:750;font-size:16px;margin-bottom:10px}.balance-value{font-size:29px;font-weight:800;letter-spacing:-.6px;line-height:1.05;white-space:nowrap}.balance-unit{font-size:13px;font-weight:700;margin-top:7px}.company .balance-label,.company .balance-value,.company .balance-unit{color:var(--company)}.personal .balance-label,.personal .balance-value,.personal .balance-unit{color:var(--personal)}.total .balance-label,.total .balance-value,.total .balance-unit{color:var(--total)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:30px 0 34px}.primary,.secondary{height:56px;border-radius:15px;font-weight:750}.primary{border:1px solid var(--brand);background:var(--brand);color:#fff}.secondary{border:2px solid #b9cfcd;background:#fff;color:var(--ink)}.recent-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.recent-head h2{font-size:18px;letter-spacing:.06em;color:var(--muted);margin:0;text-transform:uppercase}.text-btn{border:0;background:none;color:var(--brand2);font-weight:800;padding:5px 0}.tx-list{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tx-row{display:grid;grid-template-columns:44px 76px minmax(0,1fr) auto;gap:8px;align-items:center;padding:13px 8px 13px 10px;border-bottom:1px solid var(--line);min-height:72px}.tx-row:last-child{border-bottom:0}.tx-icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink);background:#eef5f4}.tx-icon svg{width:20px;height:20px}.tx-date{color:var(--muted);font-size:15px;white-space:nowrap}.tx-main{min-width:0}.tx-title{font-weight:750;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx-sub{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx-amount{text-align:right;white-space:nowrap}.amount{font-weight:850;font-size:18px}.amount.positive{color:#168a55}.amount.negative{color:var(--danger)}.owner{font-size:12px;font-weight:800}.owner.personal{color:var(--personal)}.owner.company{color:var(--company)}.empty{padding:26px;color:var(--muted);text-align:center}.modal-backdrop{position:fixed;inset:0;background:rgba(9,34,35,.42);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal-backdrop.open{display:flex}.modal{width:min(820px,100%);max-height:92vh;background:var(--bg);border-radius:22px 22px 0 0;overflow:hidden;display:flex;flex-direction:column}.modal-head{background:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:22px}.close{border:0;background:#eef5f4;color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:22px}.modal-body{overflow:auto;padding:18px 20px 28px}.year{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:12px;overflow:hidden}.year-head{width:100%;background:#fff;border:0;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800}.year-body{border-top:1px solid var(--line)}.history-row{display:grid;grid-template-columns:90px 38px minmax(0,1fr) auto;gap:8px;align-items:center;padding:13px 12px;border-bottom:1px solid var(--line)}.history-row:last-child{border-bottom:0}.history-date{color:var(--muted);font-size:14px}.history-actions{display:flex;gap:6px;justify-content:flex-end}.small-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;color:var(--ink)}.small-btn.danger{color:var(--danger)}.modal-tabs{display:flex;gap:8px;padding:0 20px 14px;background:#fff}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px}.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}.form{display:grid;gap:16px}.field{display:grid;gap:7px}.field label{font-weight:750}.field input,.field select{width:100%;height:50px;border:1px solid #cbdcda;border-radius:13px;background:#fff;padding:0 14px;color:var(--ink)}.field textarea{min-height:90px;border:1px solid #cbdcda;border-radius:13px;padding:12px 14px;resize:vertical}.form-actions{display:flex;gap:10px;margin-top:4px}.form-actions button{flex:1}.note{font-size:13px;color:var(--muted);line-height:1.45}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#15935a;color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;box-shadow:0 12px 30px rgba(19,55,57,.2);opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}.program-list{display:grid;gap:10px}.program-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center}.drag{border:0;background:#eef5f4;border-radius:9px;width:30px;height:34px;color:var(--muted);font-weight:900}.program-info strong{display:block}.program-info span{display:block;color:var(--muted);font-size:13px;margin-top:3px}.program-controls{display:flex;gap:6px}.program-controls button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px}.program-controls .danger{color:var(--danger)}.setting-row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.setting-row label{font-weight:750}.setting-row select{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
@media(max-width:520px){.topbar{height:86px;padding:0 16px;gap:10px}.brand img{width:40px;height:40px;flex-basis:40px}.brand-name{font-size:29px}.program-btn{height:48px;max-width:150px;padding:0 12px}.icon-btn{width:44px;height:48px}.content{padding:24px 24px 48px}.balances{gap:12px}.balance-card{padding:15px 12px 13px;border-radius:16px}.balance-label{font-size:15px}.balance-value{font-size:25px}.balance-unit{font-size:12px}.actions{gap:16px;margin:28px 0 32px}.primary,.secondary{height:54px}.tx-row{grid-template-columns:34px 68px minmax(0,1fr) auto;gap:6px;padding-left:4px}.tx-title{font-size:15px}.tx-date{font-size:14px}.amount{font-size:17px}.history-row{grid-template-columns:76px 34px minmax(0,1fr) auto}.modal{max-height:94vh}.modal-body{padding-left:14px;padding-right:14px}}
@media(max-width:370px){.content{padding-left:16px;padding-right:16px}.balances{gap:7px}.balance-card{padding-left:9px;padding-right:9px}.balance-value{font-size:22px}.balance-label{font-size:14px}.program-btn{max-width:132px}.brand-name{font-size:26px}.tx-row{grid-template-columns:30px 62px minmax(0,1fr) auto}.amount{font-size:15px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><img src="icon.svg" alt="MileSplit"><span class="brand-name">MileSplit</span></div>
  <div class="header-spacer"></div>
  <button class="program-btn" id="programMenuBtn" aria-expanded="false">Miles &amp; More⌄</button>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
  <div class="menu" id="programMenu"></div>
  <div class="menu" id="settingsMenu"></div>
</header>
<main class="content">
  <p class="section-label" data-i18n="balances">Balances</p>
  <section class="balances">
    <button class="balance-card company" data-owner-history="company"><div class="balance-label" data-i18n="company">Company</div><div class="balance-value" id="companyBalance">0</div><div class="balance-unit" id="companyUnit">Miles</div></button>
    <button class="balance-card personal" data-owner-history="personal"><div class="balance-label" data-i18n="personal">Personal</div><div class="balance-value" id="personalBalance">0</div><div class="balance-unit" id="personalUnit">Miles</div></button>
    <button class="balance-card total"><div class="balance-label" data-i18n="total">Total</div><div class="balance-value" id="totalBalance">0</div><div class="balance-unit" id="totalUnit">Miles</div></button>
  </section>
  <section class="actions">
    <button class="primary" id="addBtn" data-i18n="addTransaction">Add transaction</button>
    <button class="secondary" id="historyBtn" data-i18n="viewHistory">View history</button>
  </section>
  <section>
    <div class="recent-head"><h2 data-i18n="recentTransactions">Recent transactions</h2><button class="text-btn" id="recentHistoryBtn" data-i18n="viewAll">View all</button></div>
    <div class="tx-list" id="recentList"></div>
  </section>
  <div class="footer-note">MileSplit stores your data on this device.</div>
</main>
</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true">
  <div class="modal-head"><h2 id="modalTitle">History</h2><button class="close" id="modalClose">×</button></div>
  <div id="modalTabs" class="modal-tabs" style="display:none"></div>
  <div class="modal-body" id="modalBody"></div>
</div></div>
<div class="toast" id="toast">✓ Saved</div>

<script>
(() => {
'use strict';
const STORAGE='milesplit-v5-data';
const OLD_KEYS=['milesplit-data','milesplit-v4','loyalty-ledger-v4','loyalty-ledger','milesplit-v3'];
const t={en:{balances:'Balances',company:'Company',personal:'Personal',total:'Total',addTransaction:'Add transaction',viewHistory:'View history',recentTransactions:'Recent transactions',viewAll:'View all',history:'Transaction history',companyHistory:'Company history',personalHistory:'Personal history',settings:'Settings',language:'Language',automatic:'Automatic',english:'English',german:'Deutsch',managePrograms:'Manage loyalty programs',addProgram:'Add loyalty program',switchProgram:'Switch program',programs:'Loyalty programs',edit:'Edit',archive:'Archive',restore:'Restore',name:'Program name',unit:'Unit type',save:'Save',cancel:'Cancel',moveUp:'Move up',moveDown:'Move down',flight:'Flight',hotel:'Hotel',companyCard:'Company credit card',personalCard:'Personal credit card',otherEarning:'Other earning',award:'Award / redemption',adjustment:'Adjustment',date:'Date',amount:'Miles / points',owner:'Ownership',description:'Description',saveTransaction:'Save transaction',editTransaction:'Edit transaction',positiveHelp:'Positive = earned, negative = spent',noTransactions:'No transactions yet.',confirmArchive:'Archive this program? Its transactions will remain available in history.',confirmDelete:'Delete this program only if it has no transactions.',customUnit:'Custom',miles:'Miles',points:'Points',hotelPoints:'Hotel points',programSaved:'Program saved',transactionSaved:'Transaction saved',transactionUpdated:'Transaction updated',programAdded:'Program added',programArchived:'Program archived',programRestored:'Program restored',data:'Data',export:'Export backup',import:'Import backup',close:'Close',year:'Year',type:'Type'},de:{balances:'Kontostände',company:'Firma',personal:'Privat',total:'Gesamt',addTransaction:'Transaktion hinzufügen',viewHistory:'Verlauf anzeigen',recentTransactions:'Letzte Transaktionen',viewAll:'Alle anzeigen',history:'Transaktionsverlauf',companyHistory:'Firmenverlauf',personalHistory:'Privatverlauf',settings:'Einstellungen',language:'Sprache',automatic:'Automatisch',english:'English',german:'Deutsch',managePrograms:'Treueprogramme verwalten',addProgram:'Treueprogramm hinzufügen',switchProgram:'Programm auswählen',programs:'Treueprogramme',edit:'Bearbeiten',archive:'Archivieren',restore:'Wiederherstellen',name:'Programmname',unit:'Einheit',save:'Speichern',cancel:'Abbrechen',moveUp:'Nach oben',moveDown:'Nach unten',flight:'Flug',hotel:'Hotel',companyCard:'Firmenkreditkarte',personalCard:'Privatkreditkarte',otherEarning:'Sonstiger Erwerb',award:'Prämieneinlösung',adjustment:'Korrektur',date:'Datum',amount:'Meilen / Punkte',owner:'Zuordnung',description:'Beschreibung',saveTransaction:'Transaktion speichern',editTransaction:'Transaktion bearbeiten',positiveHelp:'Positiv = erhalten, negativ = eingelöst',noTransactions:'Noch keine Transaktionen.',confirmArchive:'Dieses Programm archivieren? Die Transaktionen bleiben im Verlauf erhalten.',confirmDelete:'Ein Programm kann nur gelöscht werden, wenn es keine Transaktionen hat.',customUnit:'Benutzerdefiniert',miles:'Meilen',points:'Punkte',hotelPoints:'Hotelpunkte',programSaved:'Programm gespeichert',transactionSaved:'Transaktion gespeichert',transactionUpdated:'Transaktion aktualisiert',programAdded:'Programm hinzugefügt',programArchived:'Programm archiviert',programRestored:'Programm wiederhergestellt',data:'Daten',export:'Backup exportieren',import:'Backup importieren',close:'Schließen',year:'Jahr',type:'Art'}};
let langSetting=localStorage.getItem('milesplit-language')||'auto';
function lang(){if(langSetting==='auto'){const l=(navigator.language||'en').toLowerCase();return l.startsWith('de')?'de':'en'}return langSetting}
function L(k){return t[lang()][k]||t.en[k]||k}
const typeDefs=[['flight','flight'],['hotel','hotel'],['companyCard','companyCard'],['personalCard','personalCard'],['otherEarning','otherEarning'],['award','award'],['adjustment','adjustment']];
const icons={flight:'<path d="M3 14l7-2 3-8 2 1-1 7 7 2v2l-7-1-2 4-2-1 1-4-8 1z"/>',hotel:'<path d="M4 20V9h16v11M4 13h16M7 9V6h10v3M7 17h3v3H7m7-3h3v3h-3"/>',companyCard:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 15h3"/>',personalCard:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 15h5"/>',otherEarning:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9 11h6"/>',award:'<path d="M7 4h10v8l-5 3-5-3zM9 15l-2 5 5-2 5 2-2-5"/>',adjustment:'<path d="M5 8h14M5 16h14M8 5l-3 3 3 3M16 13l3 3-3 3"/>'};
function icon(type){const p=icons[type]||icons.adjustment;return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`}
function defaultData(){return {version:5,programs:[{id:'p1',name:'Miles & More',unit:'Miles',archived:false}],activeProgramId:'p1',transactions:[]}}
function normalizeUnit(u){if(!u)return 'Miles';const s=String(u).toLowerCase();if(s.includes('point')||s.includes('punkt'))return 'Points';if(s.includes('hotel'))return 'Hotel points';return 'Miles'}
function normalizeOwner(o){const s=String(o||'personal').toLowerCase();return s.includes('comp')||s.includes('firma')?'company':'personal'}
function normalizeType(x){if(typeof x==='string'){const s=x.toLowerCase();if(s.includes('hotel'))return'hotel';if(s.includes('flight')||s.includes('flug'))return'flight';if(s.includes('company')&&s.includes('card'))return'companyCard';if(s.includes('personal')&&s.includes('card'))return'personalCard';if(s.includes('award')||s.includes('redemption')||s.includes('präm'))return'award';if(s.includes('adjust'))return'adjustment';return'otherEarning'}return 'otherEarning'}
function normalizeData(raw){
  const d=defaultData(); if(!raw||typeof raw!=='object')return d;
  const ps=Array.isArray(raw.programs)?raw.programs:Array.isArray(raw.loyaltyPrograms)?raw.loyaltyPrograms:[];
  if(ps.length)d.programs=ps.map((p,i)=>({id:String(p.id||p.programId||'p'+(i+1)),name:String(p.name||p.title||'Program '+(i+1)),unit:normalizeUnit(p.unit||p.unitType||p.currency),archived:!!p.archived}));
  const ts=Array.isArray(raw.transactions)?raw.transactions:Array.isArray(raw.entries)?raw.entries:[];
  d.transactions=ts.map((x,i)=>{const amount=Number(x.amount??x.miles??x.points??x.value??0);return {id:String(x.id||x.transactionId||Date.now()+'-'+i),programId:String(x.programId||x.loyaltyProgramId||d.programs[0].id),date:String(x.date||x.transactionDate||new Date().toISOString().slice(0,10)).slice(0,10),amount:Number.isFinite(amount)?amount:0,owner:normalizeOwner(x.owner||x.ownership||x.category),type:normalizeType(x.type||x.transactionType||x.source),description:String(x.description||x.details||x.merchant||x.route||'')}}).filter(x=>x.amount!==0||x.description);
  d.activeProgramId=String(raw.activeProgramId||raw.selectedProgramId||raw.currentProgramId||d.programs[0]?.id);if(!d.programs.some(p=>p.id===d.activeProgramId))d.activeProgramId=d.programs[0]?.id||'p1';return d;
}
function load(){try{const current=localStorage.getItem(STORAGE);if(current)return normalizeData(JSON.parse(current));for(const k of OLD_KEYS){const v=localStorage.getItem(k);if(v){const d=normalizeData(JSON.parse(v));save(d);return d}}}catch(e){}const d=defaultData();save(d);return d}
let data=load();
function save(d=data){localStorage.setItem(STORAGE,JSON.stringify(d))}
function activeProgram(){return data.programs.find(p=>p.id===data.activeProgramId)||data.programs[0]}
function fmt(n){return new Intl.NumberFormat(lang()).format(n)}
function dateFmt(s){try{return new Intl.DateTimeFormat(lang(),{month:'short',day:'numeric'}).format(new Date(s+'T12:00:00'))}catch{return s}}
function fullDate(s){try{return new Intl.DateTimeFormat(lang(),{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(s+'T12:00:00'))}catch{return s}}
function typeLabel(type){const key=typeDefs.find(x=>x[0]===type)?.[1]||'otherEarning';return L(key)}
function render(){applyI18n();const p=activeProgram();document.getElementById('programMenuBtn').textContent=p?.name+'⌄';const ts=data.transactions.filter(x=>x.programId===p?.id);const company=ts.filter(x=>x.owner==='company').reduce((a,x)=>a+x.amount,0);const personal=ts.filter(x=>x.owner==='personal').reduce((a,x)=>a+x.amount,0);document.getElementById('companyBalance').textContent=fmt(company);document.getElementById('personalBalance').textContent=fmt(personal);document.getElementById('totalBalance').textContent=fmt(company+personal);const unit=p?.unit||'Miles';document.getElementById('companyUnit').textContent=unit;document.getElementById('personalUnit').textContent=unit;document.getElementById('totalUnit').textContent=unit;renderRecent(ts);renderProgramMenu();renderSettingsMenu()}
function applyI18n(){document.documentElement.lang=lang();document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=L(el.dataset.i18n))}
function sorted(ts){return [...ts].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)))}
function renderRecent(ts){const el=document.getElementById('recentList');const rows=sorted(ts).slice(0,4);if(!rows.length){el.innerHTML='<div class="empty">'+L('noTransactions')+'</div>';return}el.innerHTML=rows.map(tx=>rowHTML(tx,false)).join('')}
function rowHTML(tx,actions){const p=data.programs.find(x=>x.id===tx.programId);const sign=tx.amount>=0?'+':'';return `<div class="tx-row"><div class="tx-icon">${icon(tx.type)}</div><div class="tx-date">${dateFmt(tx.date)}</div><div class="tx-main"><div class="tx-title">${esc(tx.description||typeLabel(tx.type))}</div><div class="tx-sub">${typeLabel(tx.type)}</div></div><div class="tx-amount"><div class="amount ${tx.amount>=0?'positive':'negative'}">${sign}${fmt(tx.amount)}</div><div class="owner ${tx.owner}">${L(tx.owner)}</div>${actions?`<div class="history-actions"><button class="small-btn" data-edit="${tx.id}">${L('edit')}</button><button class="small-btn danger" data-delete="${tx.id}">×</button></div>`:''}</div></div>`}
function historyHTML(filterProgramId,filterOwner){let ts=data.transactions.filter(x=>x.programId===filterProgramId&&(filterOwner?x.owner===filterOwner:true));ts=sorted(ts);if(!ts.length)return '<div class="empty">'+L('noTransactions')+'</div>';const groups={};ts.forEach(x=>(groups[x.date.slice(0,4)]??=[]).push(x));return Object.keys(groups).sort((a,b)=>b-a).map((y,idx)=>`<section class="year"><button class="year-head" data-year="${y}"><span>⌄ ${y} · ${groups[y].length}</span><span>${idx===0?'':''}</span></button><div class="year-body">${groups[y].map(x=>`<div class="history-row"><div class="history-date">${fullDate(x.date)}</div><div class="tx-icon">${icon(x.type)}</div><div class="tx-main"><div class="tx-title">${esc(x.description||typeLabel(x.type))}</div><div class="tx-sub">${typeLabel(x.type)} · ${L(x.owner)}</div></div><div class="history-actions"><button class="small-btn" data-edit="${x.id}">${L('edit')}</button><button class="small-btn danger" data-delete="${x.id}">×</button></div></div>`).join('')}</div></section>`).join('')}
function openModal(title,body,tabs=''){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;const mt=document.getElementById('modalTabs');mt.innerHTML=tabs;mt.style.display=tabs?'flex':'none';document.getElementById('modalBackdrop').classList.add('open')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
function openHistory(owner=null){const p=activeProgram();openModal(owner?L(owner==='company'?'companyHistory':'personalHistory'):L('history'),historyHTML(p.id,owner));bindHistory()}
function bindHistory(){document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{const body=b.nextElementSibling;body.style.display=body.style.display==='none'?'block':'none';b.querySelector('span').firstChild.textContent=body.style.display==='none'?'› ':'⌄ '});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTransaction(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteTx(b.dataset.delete))}
function renderProgramMenu(){const menu=document.getElementById('programMenu');const ps=data.programs.filter(p=>!p.archived);menu.innerHTML='<h4>'+L('switchProgram')+'</h4>'+ps.map(p=>`<button class="${p.id===data.activeProgramId?'active':''}" data-program="${p.id}">${p.id===data.activeProgramId?'✓ ':''}${esc(p.name)} <span style="color:var(--muted)">· ${esc(p.unit)}</span></button>`).join('')+`<button id="menuAddProgram">＋ ${L('addProgram')}</button><button id="menuManagePrograms">⚙ ${L('managePrograms')}</button>`;menu.querySelectorAll('[data-program]').forEach(b=>b.onclick=()=>{data.activeProgramId=b.dataset.program;save();menu.classList.remove('open');render()});menu.querySelector('#menuAddProgram').onclick=()=>openProgramEditor();menu.querySelector('#menuManagePrograms').onclick=()=>openManagePrograms()}
function renderSettingsMenu(){const menu=document.getElementById('settingsMenu');menu.innerHTML=`<h4>${L('settings')}</h4><button id="settingsLanguage">🌐 ${L('language')}: ${langSetting==='auto'?L('automatic'):langSetting==='de'?L('german'):L('english')}</button><button id="settingsManage">⚙ ${L('managePrograms')}</button><button id="settingsExport">💾 ${L('export')}</button><button id="settingsImport">↥ ${L('import')}</button>`;menu.querySelector('#settingsLanguage').onclick=()=>openLanguage();menu.querySelector('#settingsManage').onclick=()=>openManagePrograms();menu.querySelector('#settingsExport').onclick=exportData;menu.querySelector('#settingsImport').onclick=importData}
function openLanguage(){openModal(L('language'),`<div class="setting-row"><label>${L('language')}</label><select id="langSelect"><option value="auto">${L('automatic')}</option><option value="en">${L('english')}</option><option value="de">${L('german')}</option></select></div>`);document.getElementById('langSelect').value=langSetting;document.getElementById('langSelect').onchange=e=>{langSetting=e.target.value;localStorage.setItem('milesplit-language',langSetting);closeModal();render()}}
function openManagePrograms(){openModal(L('managePrograms'),`<div class="program-list" id="programList"></div><button class="primary" style="margin-top:14px;width:100%" id="manageAdd">＋ ${L('addProgram')}</button>`);renderProgramList()}
function renderProgramList(){const el=document.getElementById('programList');if(!el)return;el.innerHTML=data.programs.map((p,i)=>`<div class="program-item"><button class="drag" data-up="${p.id}" ${i===0?'disabled':''}>↥</button><div class="program-info"><strong>${esc(p.name)} ${p.id===data.activeProgramId?'✓':''}</strong><span>${esc(p.unit)} · ${p.archived?L('archive'):''}</span></div><div class="program-controls"><button data-edit-program="${p.id}">${L('edit')}</button>${p.archived?`<button data-restore="${p.id}">${L('restore')}</button>`:`<button data-archive="${p.id}" class="danger">${L('archive')}</button>`}</div></div>`).join('');el.querySelectorAll('[data-edit-program]').forEach(b=>b.onclick=()=>openProgramEditor(b.dataset.editProgram,true));el.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveProgram(b.dataset.up,-1));el.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>archiveProgram(b.dataset.archive));el.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreProgram(b.dataset.restore));document.getElementById('manageAdd').onclick=()=>openProgramEditor()}
function moveProgram(id,dir){const i=data.programs.findIndex(p=>p.id===id);const j=i+dir;if(i<0||j<0||j>=data.programs.length)return;[data.programs[i],data.programs[j]]=[data.programs[j],data.programs[i]];save();render();renderProgramList()}
function archiveProgram(id){if(!confirm(L('confirmArchive')))return;const p=data.programs.find(x=>x.id===id);if(!p)return;p.archived=true;if(data.activeProgramId===id){const next=data.programs.find(x=>!x.archived);if(next)data.activeProgramId=next.id}save();render();renderProgramList();toast(L('programArchived'))}
function restoreProgram(id){const p=data.programs.find(x=>x.id===id);if(p){p.archived=false;save();render();renderProgramList();toast(L('programRestored'))}}
function openProgramEditor(id){const p=id?data.programs.find(x=>x.id===id):null;openModal(p?L('edit'):L('addProgram'),`<form class="form" id="programForm"><div class="field"><label>${L('name')}</label><input id="pName" required value="${escAttr(p?.name||'')}" autocomplete="off"></div><div class="field"><label>${L('unit')}</label><select id="pUnit"><option>Miles</option><option>Points</option><option>Hotel points</option><option>${L('customUnit')}</option></select></div><div class="form-actions"><button type="button" class="secondary" id="pCancel">${L('cancel')}</button><button class="primary">${L('save')}</button></div></form>`);document.getElementById('pUnit').value=['Miles','Points','Hotel points'].includes(p?.unit)?p.unit:(p?'Custom':'Miles');document.getElementById('programForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('pName').value.trim();let unit=document.getElementById('pUnit').value;if(!name)return;if(unit===L('customUnit'))unit='Points';if(p){p.name=name;p.unit=unit}else{data.programs.push({id:'p'+Date.now(),name,unit,archived:false})}save();closeModal();render();toast(p?L('programSaved'):L('programAdded'))};document.getElementById('pCancel').onclick=closeModal}
function openTransaction(id){const tx=id?data.transactions.find(x=>x.id===id):null;const p=activeProgram();const date=tx?.date||new Date().toISOString().slice(0,10);openModal(tx?L('editTransaction'):L('addTransaction'),`<form class="form" id="txForm"><div class="field"><label>${L('type')}</label><select id="txType">${typeDefs.map(([k,v])=>`<option value="${k}">${L(v)}</option>`).join('')}</select></div><div class="field"><label>${L('date')}</label><input id="txDate" type="date" value="${escAttr(date)}" required></div><div class="field"><label>${L('amount')}</label><input id="txAmount" type="number" step="1" inputmode="numeric" value="${tx?tx.amount:''}" placeholder="3500" required><div class="note">${L('positiveHelp')}</div></div><div class="field"><label>${L('owner')}</label><select id="txOwner"><option value="personal">${L('personal')}</option><option value="company">${L('company')}</option></select></div><div class="field"><label>${L('description')}</label><input id="txDescription" value="${escAttr(tx?.description||'')}" placeholder="Hilton · Rostock" autocomplete="off"></div><div class="form-actions"><button type="button" class="secondary" id="txCancel">${L('cancel')}</button><button class="primary">${tx?L('save'):L('saveTransaction')}</button></div></form>`);document.getElementById('txType').value=tx?.type||'flight';document.getElementById('txOwner').value=tx?.owner||'personal';document.getElementById('txForm').onsubmit=e=>{e.preventDefault();const obj={id:tx?.id||'t'+Date.now(),programId:p.id,date:document.getElementById('txDate').value,amount:Number(document.getElementById('txAmount').value),owner:document.getElementById('txOwner').value,type:document.getElementById('txType').value,description:document.getElementById('txDescription').value.trim()};if(!Number.isFinite(obj.amount))return;if(tx)Object.assign(tx,obj);else data.transactions.push(obj);save();closeModal();render();toast(tx?L('transactionUpdated'):L('transactionSaved'))};document.getElementById('txCancel').onclick=closeModal}
function deleteTx(id){if(!confirm('Delete transaction?'))return;data.transactions=data.transactions.filter(x=>x.id!==id);save();render();openHistory()}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='milesplit-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(){const input=document.createElement('input');input.type='file';input.accept='application/json,.json';input.onchange=async()=>{try{const raw=JSON.parse(await input.files[0].text());data=normalizeData(raw);save();render();toast('Imported')}catch(e){alert('Invalid backup')}};input.click()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s||'')}
function toast(msg){const e=document.getElementById('toast');e.textContent='✓ '+msg;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1500)}
document.getElementById('programMenuBtn').onclick=e=>{e.stopPropagation();document.getElementById('settingsMenu').classList.remove('open');const m=document.getElementById('programMenu');m.classList.toggle('open')};document.getElementById('settingsBtn').onclick=e=>{e.stopPropagation();document.getElementById('programMenu').classList.remove('open');const m=document.getElementById('settingsMenu');m.classList.toggle('open')};document.addEventListener('click',()=>{document.getElementById('programMenu').classList.remove('open');document.getElementById('settingsMenu').classList.remove('open')});document.getElementById('addBtn').onclick=()=>openTransaction();document.getElementById('historyBtn').onclick=()=>openHistory();document.getElementById('recentHistoryBtn').onclick=()=>openHistory();document.querySelectorAll('[data-owner-history]').forEach(b=>b.onclick=()=>openHistory(b.dataset.ownerHistory));document.getElementById('modalClose').onclick=closeModal;document.getElementById('modalBackdrop').onclick=e=>{if(e.target===e.currentTarget)closeModal()};
render();
})();
</script>
</body></html>
