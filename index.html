<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.json"><title>Loyalty Ledger</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#17202a;margin:0}.wrap{max-width:1000px;margin:auto;padding:20px 16px 60px}header{background:#17324d;color:white;margin:-20px -16px 20px;padding:24px 16px}.brand{font-size:12px;opacity:.8;text-transform:uppercase}.title{font-size:28px;font-weight:750}.toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:end}.toolbar>div{flex:1}.panel,.card{background:white;border-radius:14px;padding:18px;box-shadow:0 1px 4px #0001;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{margin:0;cursor:pointer}.business{border-top:4px solid #4b78a8}.personal{border-top:4px solid #6c9b75}.total{border-top:4px solid #d8a928}.label,.small{font-size:12px;color:#697586}.value{font-size:24px;font-weight:750;margin-top:5px}.negative{color:#a32929}form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:600;color:#4d5966}input,select{width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #d4dae1;border-radius:9px;background:white;font:inherit}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#17324d;color:white}.secondary{background:#e9eef3;color:#17324d}.danger{background:#fbe8e8;color:#a32929}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #e7eaee;vertical-align:top}th{font-size:11px;color:#697586;text-transform:uppercase}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700}.b{background:#e8f0f8;color:#315d85}.p{background:#e9f3eb;color:#477052}.earn{background:#eef4fb;color:#315d85}.spend{background:#fbefef;color:#9a3b3b}.empty{text-align:center;color:#697586;padding:25px}.reconcile{display:flex;gap:10px;align-items:end}.reconcile>div{flex:1}.match{margin-top:10px;font-weight:700}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modalbox{background:white;border-radius:16px;max-width:850px;width:100%;max-height:90vh;overflow:auto;padding:20px}.close{float:right}.alert{background:#fff5dc;padding:10px;border-radius:10px;color:#815500;margin-top:10px}@media(max-width:700px){.toolbar{display:block}.toolbar button{margin-top:8px}.cards{grid-template-columns:1fr 1fr}.total{grid-column:1/-1}form{grid-template-columns:1fr}.full{grid-column:auto}.reconcile{display:block}.reconcile button{margin-top:8px}table{display:block;overflow-x:auto;white-space:nowrap}}
</style></head><body><div class="wrap"><header><div class="brand">Personal travel & loyalty ledger</div><div class="title">Loyalty Ledger</div></header><div class="toolbar"><div><label>Active loyalty program<select id="program"></select></label></div><button class="secondary" id="manage">Manage programs</button></div><div class="cards"><div class="card total"><div class="label" id="totalLabel">Net balance</div><div class="value" id="total">0</div></div><div class="card business" onclick="history('business')"><div class="label">Company balance · tap for history</div><div class="value" id="biz">0</div></div><div class="card personal" onclick="history('personal')"><div class="label">Personal balance · tap for history</div><div class="value" id="per">0</div></div></div>
<section class="panel"><h2>Add transaction</h2><form id="form"><input type="hidden" id="id"><label>Type<select id="type"><option value="flight">✈️ Flight earning</option><option value="card_company">💳 Company credit card</option><option value="card_personal">💳 Personal credit card</option><option value="other_earning">🎁 Other earning</option><option value="redemption">🎟️ Award / redemption</option><option value="adjustment">↔️ Adjustment</option></select></label><label>Date<input id="date" type="date" required></label><label>Miles / points<input id="miles" type="number" required></label><label>Ownership<select id="owner"><option value="business">Company</option><option value="personal">Personal</option></select></label><label id="airlineL">Airline<input id="airline"></label><label id="flightL">Flight number<input id="flight"></label><label id="routeL">Route<input id="route" placeholder="FRA → JFK"></label><label id="cardL" style="display:none">Card / account<input id="card"></label><label class="full">Description<input id="desc"></label><div class="full actions"><button class="primary">Add transaction</button><button class="secondary" type="button" id="cancel" style="display:none">Cancel edit</button></div></form></section>
<section class="panel"><h2>Reconcile with loyalty account</h2><div class="reconcile"><div><label>Current account balance<input id="recon" type="number"></label></div><button class="secondary" id="check">Check</button></div><div class="match" id="result"></div></section>
<section class="panel"><h2>Transaction history</h2><div class="actions"><button class="secondary" id="csv">Export CSV</button><button class="secondary" id="backup">Backup data</button><label class="secondary" style="padding:10px 13px;border-radius:9px;cursor:pointer">Restore backup<input id="restore" type="file" accept=".json" style="display:none"></label><button class="danger" id="clear">Clear all transactions</button></div><div id="table"></div></section></div>
<div class="modal" id="hm"><div class="modalbox"><button class="secondary close" onclick="closeM('hm')">Close</button><h2 id="ht"></h2><div class="value" id="hb"></div><div id="hw"></div><div id="hbody"></div></div></div>
<div class="modal" id="pm"><div class="modalbox"><button class="secondary close" onclick="closeM('pm')">Close</button><h2>Loyalty programs</h2><div id="plist"></div><div class="panel"><h3>Add program</h3><form id="pf"><label>Program name<input id="pn" placeholder="e.g. Flying Blue" required></label><label>Unit<input id="pu" value="miles" placeholder="miles or points"></label><div class="full"><button class="primary">Add program</button></div></form></div></div></div>
<script>
const K='loyalty-ledger-v4',OLD='mm-ledger-v3';const $=x=>document.getElementById(x),fmt=n=>Number(n||0).toLocaleString('en-US');const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let s=(()=>{try{let x=JSON.parse(localStorage.getItem(K));if(x)return x}catch{}let tx=[];try{tx=JSON.parse(localStorage.getItem(OLD)||'[]').map(x=>({...x,id:x.id||uid(),programId:'miles-more'}))}catch{}return{programs:[{id:'miles-more',name:'Miles & More',unit:'miles'}],transactions:tx,activeProgramId:'miles-more'}})();
const P=()=>s.programs.find(x=>x.id===s.activeProgramId)||s.programs[0],TX=()=>s.transactions.filter(x=>x.programId===s.activeProgramId),BAL=o=>TX().filter(x=>x.owner===o).reduce((a,x)=>a+Number(x.miles),0);function save(){localStorage.setItem(K,JSON.stringify(s));render()}
function typeName(t){return{flight:'Flight',card_company:'Company card',card_personal:'Personal card',other_earning:'Other earning',redemption:'Redemption',adjustment:'Adjustment'}[t]||t}function details(x){if(x.type==='flight')return esc((x.airline+' '+x.flight).trim())+'<br>'+esc(x.route);if(x.type.startsWith('card_'))return esc(x.card||'Credit card');return esc(x.desc||'')}
function render(){let p=P(),tx=TX(),b=BAL('business'),q=BAL('personal'),tot=b+q;$('program').innerHTML=s.programs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('program').value=s.activeProgramId;$('totalLabel').textContent=`Net ${p.unit} in ${p.name}`;$('total').textContent=fmt(tot);$('biz').textContent=fmt(b);$('per').textContent=fmt(q);$('biz').className='value '+(b<0?'negative':'');$('per').className='value '+(q<0?'negative':'');if(!tx.length){$('table').innerHTML='<div class="empty">No transactions for '+esc(p.name)+'.</div>';return}tx.sort((a,b)=>b.date.localeCompare(a.date));$('table').innerHTML='<table><thead><tr><th>Date</th><th>Type</th><th>Details</th><th>'+esc(p.unit)+'</th><th>Ownership</th><th>Actions</th></tr></thead><tbody>'+tx.map(x=>`<tr><td>${esc(x.date)}</td><td><span class="pill ${x.miles<0?'spend':'earn'}">${typeName(x.type)}</span></td><td>${details(x)}</td><td>${x.miles>0?'+':''}${fmt(x.miles)}</td><td><span class="pill ${x.owner==='business'?'b':'p'}">${x.owner==='business'?'Company':'Personal'}</span></td><td><button class="secondary" onclick="edit('${x.id}')">Edit</button> <button class="danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')+'</tbody></table>'}
$('program').onchange=e=>{s.activeProgramId=e.target.value;save();reset()};$('type').onchange=fields;function fields(){let t=$('type').value,flight=t==='flight',card=t.startsWith('card_');['airlineL','flightL','routeL'].forEach(x=>$(x).style.display=flight?'block':'none');$('cardL').style.display=card?'block':'none';if(t==='card_company')$('owner').value='business';if(t==='card_personal')$('owner').value='personal'}
function reset(){ $('id').value='';$('date').value='';$('miles').value='';$('airline').value='';$('flight').value='';$('route').value='';$('card').value='';$('desc').value='';$('owner').value='business';$('cancel').style.display='none';$('form').querySelector('button').textContent='Add transaction';fields() }
$('form').onsubmit=e=>{e.preventDefault();let t=$('type').value,m=Number($('miles').value);if(t==='redemption'&&m>0)m=-m;let x={id:$('id').value||uid(),programId:s.activeProgramId,type:t,date:$('date').value,miles:m,owner:$('owner').value,airline:$('airline').value,flight:$('flight').value,route:$('route').value,card:$('card').value,desc:$('desc').value};let i=s.transactions.findIndex(y=>y.id===x.id);if(i>=0)s.transactions[i]=x;else s.transactions.push(x);reset();save()};function edit(id){let x=s.transactions.find(y=>y.id===id);if(!x)return;Object.keys({}).forEach(()=>{});$('id').value=x.id;$('type').value=x.type;$('date').value=x.date;$('miles').value=x.miles;$('owner').value=x.owner;$('airline').value=x.airline||'';$('flight').value=x.flight||'';$('route').value=x.route||'';$('card').value=x.card||'';$('desc').value=x.desc||'';fields();$('cancel').style.display='inline-block';$('form').querySelector('button').textContent='Save changes';scrollTo({top:0,behavior:'smooth'})}function del(id){if(confirm('Delete this transaction?')){s.transactions=s.transactions.filter(x=>x.id!==id);save()}}$('cancel').onclick=reset;
$('check').onclick=()=>{let n=Number($('recon').value),d=n-TX().reduce((a,x)=>a+Number(x.miles),0);$('result').textContent=d===0?'✓ Matches your ledger.':'Difference: '+(d>0?'+':'')+fmt(d)+' '+P().unit};
function history(o){let a=TX().filter(x=>x.owner===o).sort((a,b)=>a.date.localeCompare(b.date)),b=0;$('ht').textContent=(o==='business'?'Company':'Personal')+' balance history · '+P().name;$('hb').textContent=fmt(BAL(o));let h='<table><thead><tr><th>Date</th><th>Transaction</th><th>Change</th><th>Balance</th></tr></thead><tbody>';a.forEach(x=>{b+=Number(x.miles);h+=`<tr><td>${esc(x.date)}</td><td>${typeName(x.type)}<br>${details(x)}</td><td>${x.miles>0?'+':''}${fmt(x.miles)}</td><td class="${b<0?'negative':''}">${fmt(b)}</td></tr>`});h+='</tbody></table>';$('hbody').innerHTML=a.length?h:'<div class="empty">No transactions.</div>';$('hw').innerHTML=BAL(o)<0?'<div class="alert">⚠️ Negative ownership balance. The ledger still reconciles mathematically.</div>':'';$('hm').classList.add('open')}function closeM(id){$(id).classList.remove('open')}
$('manage').onclick=()=>{plist();$('pm').classList.add('open')};function plist(){$('plist').innerHTML=s.programs.map(p=>`<div class="panel"><strong>${esc(p.name)}</strong><div class="small">${esc(p.unit)} · ${s.transactions.filter(x=>x.programId===p.id).length} transactions</div>${p.id!=='miles-more'?`<button class="danger" onclick="dp('${p.id}')">Delete</button>`:'<div class="small">Default program</div>'}</div>`).join('')}function dp(id){if(s.transactions.some(x=>x.programId===id)){alert('This program has transactions. Delete those transactions before deleting it.');return}if(confirm('Delete this program?')){s.programs=s.programs.filter(x=>x.id!==id);s.activeProgramId=s.programs[0].id;save();plist()}}$('pf').onsubmit=e=>{e.preventDefault();let p={id:uid(),name:$('pn').value.trim(),unit:$('pu').value.trim()||'miles'};if(!p.name)return;s.programs.push(p);s.activeProgramId=p.id;$('pn').value='';$('pu').value='miles';save();plist();closeM('pm')};
function download(n,d,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click()}$('csv').onclick=()=>{let p=P(),r=[['Program','Unit','Date','Type','Airline','Flight','Route','Card','Miles','Ownership','Description'],...TX().map(x=>[p.name,p.unit,x.date,typeName(x.type),x.airline,x.flight,x.route,x.card,x.miles,x.owner,x.desc])];download('loyalty-ledger.csv',r.map(a=>a.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')};$('backup').onclick=()=>download('loyalty-ledger-backup.json',JSON.stringify(s,null,2),'application/json');$('restore').onchange=e=>{let r=new FileReader();r.onload=()=>{try{s=JSON.parse(r.result);save();alert('Backup restored.')}catch{alert('Invalid backup file.')}};r.readAsText(e.target.files[0])};$('clear').onclick=()=>{if(confirm('Delete ALL transactions across ALL programs?')){s.transactions=[];save()}};render();fields();
</script></body></html>
