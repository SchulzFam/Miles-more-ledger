<div class="wrap">

<div class="actions-row"><button class="primary" id="addTop" type="button">Add transaction</button><button class="secondary" id="viewAllBtn" type="button">View history</button></div>
<section class="recent-section"><div class="sectionline"><h2 id="recentHeading">Recent transactions</h2><button class="linkbtn" id="viewAllLink" type="button">View history</button></div><div id="recentWrap"></div></section>

<section class="panel"><h2 id="reconcileHeading">Reconcile with loyalty account</h2><div class="form-grid"><label id="accountBalanceLabel">Current account balance<input id="balance" type="number" min="0" step="1"></label><div style="display:flex;align-items:end"><button class="secondary" id="reconcileBtn" type="button">Check</button></div></div><div id="reconcileResult" class="hint" style="margin-top:9px"></div></section>
<section class="panel"><h2 id="backupHeading">Data</h2><div class="form-actions"><button class="secondary" id="exportBtn" type="button">Export CSV</button><button class="secondary" id="backupBtn" type="button">Backup data</button><label class="secondary" style="display:inline-flex;align-items:center;cursor:pointer">Restore backup<input id="restore" type="file" accept=".json" style="display:none"></label><button class="danger" id="clearBtn" type="button">Clear all transactions</button></div></section>
</div>

<div class="modal" id="historyModal"><div class="modalbox"><div class="modal-head"><div><h2 id="historyTitle">Transaction history</h2><div class="hint" id="historySub"></div></div><button class="close-btn" id="closeHistoryBtn" type="button">Close</button></div><div class="history-summary"><div class="hint" id="historyFilter"></div><div class="balance" id="historyBalance">0</div></div><div id="historyWarning"></div><div id="historyTable"></div></div></div>
<div class="modal" id="programModal"><div class="modalbox"><div class="modal-head"><h2 id="programsHeading">Loyalty programs</h2><button class="close-btn" id="closeProgramsBtn" type="button">Close</button></div><div id="programList"></div><div class="panel" style="margin-top:14px;background:#f7faf9"><h2 id="addProgramHeading">Add program</h2><form id="programForm" class="form-grid"><label id="newProgramLabel">Program name<input id="newProgram" required></label><label id="newUnitLabel">Unit type<select id="newUnit"><option value="miles">Miles</option><option value="points">Points</option></select></label><div class="full"><button class="primary" type="submit" id="addProgramBtn">Add program</button></div></form></div></div></div>
<div class="modal" id="languageModal"><div class="modalbox" style="max-width:520px"><div class="modal-head"><h2 id="languageHeading">Language</h2><button class="close-btn" id="closeLanguageBtn" type="button">Close</button></div><label id="languageLabel">Language<select id="languageSelect"><option value="auto">Automatic</option><option value="en">English</option><option value="de">Deutsch</option></select></label></div></div>
<div class="modal" id="dataModal"><div class="modalbox" style="max-width:620px"><div class="modal-head"><h2 id="dataHeading">Data & backup</h2><button class="close-btn" id="closeDataBtn" type="button">Close</button></div><div class="form-actions"><button class="secondary" id="exportBtn2" type="button">Export CSV</button><button class="secondary" id="backupBtn2" type="button">Backup data</button><label class="secondary" style="display:inline-flex;align-items:center;cursor:pointer">Restore backup<input id="restore2" type="file" accept=".json" style="display:none"></label></div></div></div>

function normalizeProgram(p,i){const id=String(p&&p.id||p&&p.programId||'program-'+i);return{id,name:String(p&&p.name||p&&p.programName||'Loyalty program'),unit:unitNorm(p&&p.unit||p&&p.unitType||p&&p.pointsType),archived:!!(p&&p.archived)}}
function normalizeTx(t,programs){const x=t||{};let pid=x.programId||x.programID||x.program||x.loyaltyProgramId; if(typeof pid==='object'&&pid)pid=pid.id||pid.name;let match=programs.find(p=>p.id===pid)||programs.find(p=>p.name===pid);if(!match)match=programs[0];return{id:String(x.id||uid()),programId:match?match.id:'miles-more',date:String(x.date||x.transactionDate||''),type:typeNorm(x.type||x.kind||x.category),miles:Number(x.miles??x.points??x.amount??0),owner:ownerNorm(x.owner||x.ownership||x.categoryOwner||x.attribution),airline:String(x.airline||''),flight:String(x.flight||x.flightNo||x.flightNumber||''),route:String(x.route||''),hotel:String(x.hotel||x.hotelName||''),location:String(x.location||''),card:String(x.card||x.cardName||''),description:String(x.description||x.note||'')}}
function defaultState(){return{version:5.2,programs:[{id:'miles-more',name:'Miles & More',unit:'miles',archived:false}],transactions:[],activeProgramId:'miles-more'}}
function validateState(x){return !!x&&Array.isArray(x.programs)&&Array.isArray(x.transactions)}
function normalizeState(x){const s=defaultState();s.programs=x.programs.length?x.programs.map(normalizeProgram):s.programs; if(!s.programs.some(p=>p.id==='miles-more')&&s.programs.length===0)s.programs=s.programs.concat(defaultState().programs);s.transactions=x.transactions.map(t=>normalizeTx(t,s.programs));s.activeProgramId=x.activeProgramId||x.activeProgram||s.programs[0].id;if(!s.programs.some(p=>p.id===s.activeProgramId))s.activeProgramId=s.programs[0].id;s.version=5.2;return s}
function load(){
 let current=null;
 const raw=localStorage.getItem(DATA_KEY);
 if(raw){try{const x=JSON.parse(raw);if(validateState(x))current=normalizeState(x)}catch(e){}}
 let legacy=null;
 for(const key of LEGACY_KEYS){const raw2=localStorage.getItem(key);if(!raw2)continue;try{const x=JSON.parse(raw2);if(validateState(x)){legacy=normalizeState(x);break}if(Array.isArray(x)){const s=defaultState();s.transactions=x.map(t=>normalizeTx(t,s.programs));legacy=s;break}}catch(e){}}
 if(!current)return legacy||defaultState();
 if(legacy){
   // Preserve anything that exists in an older valid ledger but disappeared from a newer/corrupted copy.
   const programByName=new Map(current.programs.map(p=>[p.name.toLowerCase(),p]));
   legacy.programs.forEach(lp=>{if(!current.programs.some(p=>p.id===lp.id)){const sameName=programByName.get(lp.name.toLowerCase());if(!sameName)current.programs.push({...lp})}});
   const ids=new Set(current.transactions.map(t=>t.id));
   legacy.transactions.forEach(lt=>{if(!ids.has(lt.id)){current.transactions.push({...lt});ids.add(lt.id)}});
   // If the newer copy has a transaction with the same date/amount/details as the legacy copy,
   // prefer the legacy ownership when the newer copy has fallen back to Personal.
   current.transactions.forEach(ct=>{
     const same=legacy.transactions.find(lt=>lt.date===ct.date&&Number(lt.miles)===Number(ct.miles)&&lt.type===ct.type&&lt.programId===ct.programId&&((lt.description||'')===(ct.description||'')));
     if(same&&ct.owner==='personal'&&same.owner==='business')ct.owner='business';
   });
 }
 if(!current.programs.length)current.programs=defaultState().programs;
 if(!current.programs.some(p=>!p.archived))current.programs[0].archived=false;
 if(!current.programs.some(p=>p.id===current.activeProgramId&&!p.archived))current.activeProgramId=current.programs.find(p=>!p.archived).id;
 return current
}
state=load();
function save(){localStorage.setItem(DATA_KEY,JSON.stringify(state));render()}
function activeProgram(){return state.programs.find(p=>p.id===state.activeProgramId&&!p.archived)||state.programs.find(p=>!p.archived)||state.programs[0]}
function activeTx(){const p=activeProgram();return state.transactions.filter(t=>t.programId===p.id)}
function balance(owner){return activeTx().filter(t=>t.owner===owner).reduce((s,t)=>s+Number(t.miles),0)}
function typeLabel(t){return tr(typeNorm(t.type))}
function details(t){const d=t.type==='flight'?[t.airline,t.flight].filter(Boolean).join(' ')+(t.route?' · '+t.route:''):t.type==='hotel'?[t.hotel||tr('hotel'),t.location].filter(Boolean).join(' · '):['card_company','card_personal'].includes(t.type)?t.card||'':t.description||'';return esc(d)}
const ICONS={flight:'✈',hotel:'▣',card_company:'▤',card_personal:'▤',other_earning:'＋',redemption:'▮',adjustment:'↕'};
function icon(t){return '<span class="tx-icon" aria-hidden="true">'+(ICONS[typeNorm(t.type)]||'•')+'</span>'}
function render(){const p=activeProgram(),tx=activeTx(),biz=balance('business'),per=balance('personal'),total=biz+per;document.querySelectorAll('.unit').forEach(e=>e.textContent=p.unit==='points'?tr('points'):tr('miles'));$('business').textContent=fmt(biz);$('personal').textContent=fmt(per);$('total').textContent=fmt(total);$('business').classList.toggle('negative',biz<0);$('personal').classList.toggle('negative',per<0);$('total').classList.toggle('negative',total<0);renderPrograms();const sorted=tx.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));$('recentWrap').innerHTML=sorted.length?'<ul class="recent-list">'+sorted.slice(0,4).map(t=>'<li class="recent-item">'+icon(t)+'<div class="recent-date">'+esc(formatDate(t.date))+'</div><div><div class="recent-title">'+esc(detailsPlain(t))+'</div><div class="recent-sub">'+esc(typeLabel(t))+'</div></div><div class="amount '+(t.miles<0?'neg':'pos')+'">'+(t.miles>0?'+':'')+fmt(t.miles)+'<div class="owner '+(t.owner==='business'?'company':'personal')+'">'+tr(t.owner)+'</div></div></li>').join('')+'</ul>':'<div class="empty">'+tr('noRecent',{program:esc(p.name)})+'</div>'}
function detailsPlain(t){if(t.type==='flight')return [t.airline,t.flight].filter(Boolean).join(' ')||tr('flight');if(t.type==='hotel')return [t.hotel,t.location].filter(Boolean).join(' · ')||tr('hotel');if(t.type==='card_company'||t.type==='card_personal')return t.card||tr(t.type);return t.description||typeLabel(t)}
function formatDate(s){if(!s)return'';const d=new Date(s+'T00:00:00');return d.toLocaleDateString(lang==='de'?'de-DE':'en-US',{month:'short',day:'numeric'})}
function renderPrograms(){const list=state.programs.filter(p=>!p.archived);$('programSelect').innerHTML=list.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');$('programSelect').value=activeProgram().id}
function applyI18n(){document.documentElement.lang=lang;$('balancesHeading').textContent=tr('balances');$('addTop').textContent=tr('add');$('viewAllBtn').textContent=tr('view');$('viewAllLink').textContent=tr('view');$('recentHeading').textContent=tr('recent');$('addHeading').textContent=$('editId').value?tr('edit'):tr('add');$('signHint').textContent=tr('positive');$('reconcileHeading').textContent=tr('reconcile');$('accountBalanceLabel').childNodes[0].textContent=tr('currentBalance')+' ';$('reconcileBtn').textContent=tr('check');$('settingsTitle').textContent=tr('settings');$('manageFromSettings').textContent=tr('manage');$('languageMenu').textContent=tr('language');$('dataMenu').textContent=tr('data');$('historySub').textContent=tr('running');$('closeHistoryBtn').textContent=tr('close');$('programsHeading').textContent=tr('programs');$('closeProgramsBtn').textContent=tr('close');$('addProgramHeading').textContent=tr('addProgram');$('newProgramLabel').childNodes[0].textContent=tr('programName')+' ';$('newUnitLabel').childNodes[0].textContent=tr('unit')+' ';$('addProgramBtn').textContent=tr('addProgram');$('languageHeading').textContent=tr('language');$('closeLanguageBtn').textContent=tr('close');$('dataHeading').textContent=tr('data');$('closeDataBtn').textContent=tr('close');$('flightLabel').childNodes[0].textContent=tr('flightNo')+' ';$('airlineLabel').childNodes[0].textContent=tr('airline')+' ';$('routeLabel').childNodes[0].textContent=tr('route')+' ';$('hotelLabel').childNodes[0].textContent=tr('hotelName')+' ';$('locationLabel').childNodes[0].textContent=tr('location')+' ';$('cardLabel').childNodes[0].textContent=tr('card')+' ';$('descriptionLabel').childNodes[0].textContent=tr('description')+' ';$('languageSelect').value=localStorage.getItem('milesplit-language')||'auto';$('newProgram').placeholder='';$('airline').placeholder=tr('flightPlaceholder');$('flight').placeholder=tr('flightNoPlaceholder');$('route').placeholder=tr('routePlaceholder');$('hotel').placeholder=tr('hotelPlaceholder');$('location').placeholder=tr('locationPlaceholder');$('card').placeholder=tr('cardPlaceholder');$('description').placeholder=tr('descriptionPlaceholder');renderTypeOptions();applyUnitOptions()}
function renderTypeOptions(){const val=$('type').value||'flight',opts=['flight','hotel','card_company','card_personal','other_earning','redemption','adjustment'];$('type').innerHTML=opts.map(x=>'<option value="'+x+'">'+tr(x)+'</option>').join('');$('type').value=opts.includes(val)?val:'flight';updateFields()}
function applyUnitOptions(){const val=$('newUnit').value||'miles';$('newUnit').innerHTML='<option value="miles">'+tr('miles')+'</option><option value="points">'+tr('points')+'</option>';$('newUnit').value=val==='points'?'points':'miles'}
function updateFields(){const t=$('type').value;$('flightFields').style.display=t==='flight'?'block':'none';$('hotelFields').style.display=t==='hotel'?'block':'none';$('cardFields').style.display=t==='card_company'||t==='card_personal'?'block':'none';if(t==='card_company')$('owner').value='business';if(t==='card_personal')$('owner').value='personal'}
function setForm(t){$('editId').value=t?t.id:'';$('type').value=t?typeNorm(t.type):'flight';$('date').value=t?t.date:'';$('miles').value=t?Number(t.miles):'';$('owner').value=t?ownerNorm(t.owner):'business';$('airline').value=t?t.airline:'';$('flight').value=t?t.flight:'';$('route').value=t?t.route:'';$('hotel').value=t?t.hotel:'';$('location').value=t?t.location:'';$('card').value=t?t.card:'';$('description').value=t?t.description:'';renderTypeOptions();$('submitBtn').textContent=t?tr('save'):tr('add');$('cancelEdit').textContent=tr('cancel');$('cancelEdit').style.display=t?'inline-block':'none';$('addHeading').textContent=t?tr('edit'):tr('add')}
function toast(s){$('toastText').textContent=s;$('toast').classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.remove('show'),1500)}
function sortNewest(a){return a.slice().sort((x,y)=>y.date.localeCompare(x.date)||y.id.localeCompare(x.id))}
function renderHistory(owner){let a=owner?activeTx().filter(t=>t.owner===owner):activeTx();a=sortNewest(a);const years={};a.forEach(t=>{const y=t.date?t.date.slice(0,4):'—';(years[y]||(years[y]=[])).push(t)});const ys=Object.keys(years).sort().reverse();$('historyTable').innerHTML=ys.length?ys.map((y,i)=>'<details class="year" '+(i===0?'open':'')+'><summary>'+esc(y)+' · '+years[y].length+'</summary>'+tableFor(years[y])+'</details>').join(''):'<div class="empty">'+tr('noCategory')+'</div>'}
function tableFor(a){return '<table><thead><tr><th>'+tr('date')+'</th><th>'+tr('type')+'</th><th>'+tr('description')+'</th><th>'+esc(activeProgram().unit==='points'?tr('points'):tr('miles'))+'</th><th>'+tr('ownership')+'</th><th></th></tr></thead><tbody>'+a.map(t=>'<tr><td>'+esc(t.date)+'</td><td><span class="pill '+(t.miles<0?'spend':'earn')+'">'+esc(typeLabel(t))+'</span></td><td>'+details(t)+'</td><td class="amount-cell">'+(t.miles>0?'+':'')+fmt(t.miles)+'</td><td>'+esc(tr(t.owner))+'</td><td><button class="small-btn" onclick="editTx(\''+esc(t.id)+'\')" type="button">'+tr('edit')+'</button></td></tr>').join('')+'</tbody></table>'}
function openHistory(owner){$('historyModal').classList.add('open');const p=activeProgram();$('historyTitle').textContent=owner?tr(owner)+' · '+p.name:tr('history')+' · '+p.name;$('historyFilter').textContent=owner?tr(owner):tr('all');$('historyBalance').textContent=fmt(owner?balance(owner):activeTx().reduce((s,t)=>s+Number(t.miles),0));renderHistory(owner)}
window.editTx=id=>{const t=state.transactions.find(x=>x.id===id);if(!t)return;closeModals();setForm(t);$('transactionPanel').scrollIntoView({behavior:'smooth',block:'start'})};
function closeModals(){['historyModal','programModal','languageModal','dataModal'].forEach(id=>$(id).classList.remove('open'));$('settingsMenu').classList.remove('open')}
$('txForm').addEventListener('submit',e=>{e.preventDefault();const id=$('editId').value,type=$('type').value;let miles=Number($('miles').value);if(!Number.isFinite(miles)||!$('date').value){alert(lang==='de'?'Bitte Datum und gültigen Betrag eingeben.':'Please enter a date and valid amount.');return}if(type==='redemption'&&miles>0)miles=-miles;const obj={id:id||uid(),programId:activeProgram().id,date:$('date').value,type,miles,owner:ownerNorm($('owner').value),airline:$('airline').value.trim(),flight:$('flight').value.trim(),route:$('route').value.trim(),hotel:$('hotel').value.trim(),location:$('location').value.trim(),card:$('card').value.trim(),description:$('description').value.trim()};if(id){const i=state.transactions.findIndex(t=>t.id===id);if(i>=0)state.transactions[i]=obj}else state.transactions.push(obj);setForm(null);save();toast(tr(id?'updated':'added'))});
$('cancelEdit').addEventListener('click',()=>setForm(null));$('type').addEventListener('change',updateFields);$('programSelect').addEventListener('change',()=>{state.activeProgramId=$('programSelect').value;save();setForm(null)});$('addTop').addEventListener('click',()=>$('transactionPanel').scrollIntoView({behavior:'smooth',block:'start'}));$('viewAllBtn').addEventListener('click',()=>openHistory());$('viewAllLink').addEventListener('click',()=>openHistory());$('closeHistoryBtn').addEventListener('click',()=>closeModals());$('companyCard').addEventListener('click',()=>openHistory('business'));$('personalCard').addEventListener('click',()=>openHistory('personal'));
$('settingsBtn').addEventListener('click',e=>{e.stopPropagation();$('settingsMenu').classList.toggle('open')});document.addEventListener('click',e=>{if(!$('settingsMenu').contains(e.target)&&e.target!==$('settingsBtn'))$('settingsMenu').classList.remove('open')});$('manageFromSettings').addEventListener('click',()=>{openPrograms();$('settingsMenu').classList.remove('open')});$('languageMenu').addEventListener('click',()=>{openModal('languageModal');$('settingsMenu').classList.remove('open')});$('dataMenu').addEventListener('click',()=>{openModal('dataModal');$('settingsMenu').classList.remove('open')});
function openModal(id){$(id).classList.add('open')};function openPrograms(){renderProgramList();openModal('programModal')};$('closeProgramsBtn').addEventListener('click',closeModals);$('closeLanguageBtn').addEventListener('click',closeModals);$('closeDataBtn').addEventListener('click',closeModals);
function renderProgramList(){const list=state.programs.map((p,i)=>{const count=state.transactions.filter(t=>t.programId===p.id).length;return '<div class="program-row"><div class="drag-controls"><button type="button" onclick="moveProgram(\''+p.id+'\',-1)" '+(i===0?'disabled':'')+'>↑</button><button type="button" onclick="moveProgram(\''+p.id+'\',1)" '+(i===state.programs.length-1?'disabled':'')+'>↓</button></div><div class="program-main"><div class="program-name">'+esc(p.name)+'</div><div class="program-meta">'+esc(p.unit==='points'?tr('points'):tr('miles'))+' · '+count+' '+(count===1?'transaction':'transactions')+(p.id==='miles-more'?' · '+tr('default'):'')+(p.archived?' · '+tr('archive'):'')+'</div></div><div class="program-actions"><button class="small-btn" type="button" onclick="editProgram(\''+p.id+'\')">'+tr('edit')+'</button><button class="small-btn" type="button" onclick="toggleArchive(\''+p.id+'\')">'+(p.archived?tr('restoreProgram'):tr('archive'))+'</button></div></div><div id="edit-'+esc(p.id)+'"></div>'}).join('');$('programList').innerHTML=list}
window.moveProgram=(id,dir)=>{const i=state.programs.findIndex(p=>p.id===id),j=i+dir;if(i<0||j<0||j>=state.programs.length)return;[state.programs[i],state.programs[j]]=[state.programs[j],state.programs[i]];save();renderProgramList()};
window.editProgram=id=>{const p=state.programs.find(x=>x.id===id);if(!p)return;const host=$('edit-'+id);host.innerHTML='<div class="edit-box"><div class="form-grid"><label>Program name<input id="ename-'+esc(id)+'" value="'+esc(p.name)+'"></label><label>Unit type<select id="eunit-'+esc(id)+'"><option value="miles">'+tr('miles')+'</option><option value="points">'+tr('points')+'</option></select></label><div class="full form-actions"><button class="primary" type="button" onclick="saveProgram(\''+esc(id)+'\')">'+tr('save')+'</button></div></div></div>';$('eunit-'+id).value=p.unit==='points'?'points':'miles'};
window.saveProgram=id=>{const p=state.programs.find(x=>x.id===id);if(!p)return;const name=$('ename-'+id).value.trim();if(!name)return;p.name=name;p.unit=$('eunit-'+id).value==='points'?'points':'miles';save();renderProgramList();toast(tr('programSaved'))};
window.toggleArchive=id=>{const p=state.programs.find(x=>x.id===id);if(!p)return;if(p.archived){p.archived=false}else{p.archived=true;if(activeProgram().id===id){const next=state.programs.find(x=>!x.archived&&x.id!==id);if(next)state.activeProgramId=next.id}}save();renderProgramList()};
$('programForm').addEventListener('submit',e=>{e.preventDefault();const name=$('newProgram').value.trim();if(!name)return;const p={id:uid(),name,unit:$('newUnit').value==='points'?'points':'miles',archived:false};state.programs.push(p);state.activeProgramId=p.id;$('newProgram').value='';save();renderProgramList();toast(tr('programAdded'))});
$('languageSelect').addEventListener('change',()=>{localStorage.setItem('milesplit-language',$('languageSelect').value);lang=$('languageSelect').value==='auto'?detectLang():$('languageSelect').value;applyI18n();render();renderProgramList()});
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){const rows=[['Program','Unit','Date','Type','Airline','Flight','Route','Hotel','Location','Card','Amount','Ownership','Description']];state.transactions.forEach(t=>{const p=state.programs.find(p=>p.id===t.programId);rows.push([p?p.name:'',p?p.unit:'',t.date,typeLabel(t),t.airline,t.flight,t.route,t.hotel,t.location,t.card,t.miles,t.owner,t.description])});download('milesplit-transactions.csv',rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}
function backup(){download('milesplit-backup.json',JSON.stringify(state,null,2),'application/json')}
function restoreFile(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!validateState(x))throw new Error('shape');const next=normalizeState(x);if(state.transactions.length>0&&next.transactions.length===0)throw new Error('empty');if(state.programs.length>1&&next.programs.length<state.programs.length)throw new Error('destructive');state=next;save();alert(tr('restored'))}catch(e){alert(e.message==='empty'||e.message==='destructive'?tr('backupRejected'):tr('invalidBackup'))}};r.readAsText(file)}
$('exportBtn').addEventListener('click',exportCSV);$('exportBtn2').addEventListener('click',exportCSV);$('backupBtn').addEventListener('click',backup);$('backupBtn2').addEventListener('click',backup);$('restore').addEventListener('change',e=>{if(e.target.files[0])restoreFile(e.target.files[0]);e.target.value=''});$('restore2').addEventListener('change',e=>{if(e.target.files[0])restoreFile(e.target.files[0]);e.target.value=''});$('clearBtn').addEventListener('click',()=>{if(confirm(tr('confirmClear'))){state.transactions=[];save()}});$('reconcileBtn').addEventListener('click',()=>{const v=Number($('balance').value),d=v-activeTx().reduce((s,t)=>s+Number(t.miles),0);$('reconcileResult').textContent=Math.abs(d)<0.0001?tr('match'):tr('difference',{d:fmt(d)})});
applyI18n();render();setForm(null);
})();
